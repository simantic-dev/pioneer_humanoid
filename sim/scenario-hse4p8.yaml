# Sim addition. scenario.yaml with the HSE at 4.8 MHz, the HSE_VALUE their platformio.ini names (joint-hse4p8.board).
# Part scripts and the elf are relative to this file; overlay peers relative to the repository root, where sim runs.
machines:
  dut:
    mcu: STM32G474RET6
    overlay: joint-hse4p8.board
    elf: build/joint.elf
    parts:
      - { name: plant,   type: peripheral, address: 0xA0000400, size: 0x4, script: peers/foc_plant.py }
      - { name: encoder, type: spi-device, bus: spi1, cs: PA0, script: peers/mt6835_peer.py }
media:
  - type: can
    connect: [dut.fdcan2, dut.canpeer]
timeout: 3.5
